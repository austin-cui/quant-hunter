name: flow-update

on:
  push:
    paths:
      - "crawler/**"
      - ".github/workflows/flow-update.yml"
  schedule:
    - cron: "0 1 * * *" # 每天 09:00 北京时间
    - cron: "0 3 * * *" # 每天 11:00 北京时间（09:00 的兜底）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Crawl AMAC & push db.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python crawler/cloud_update.py
